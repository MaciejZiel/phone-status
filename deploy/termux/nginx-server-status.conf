# Include inside the server { } block that is exposed through the tunnel.
# Needs two more files (see their headers):
#   nginx-zones.conf    in the http { } block: the CF-Connecting-IP key and the rate-limit zone
#   nginx-headers.conf  copied to snippets/server-status-headers.conf (included below)
# The administrator view has its own file: nginx-server-status-admin.conf (include it as well).
location = /status {
    include snippets/server-status-headers.conf;
    return 301 /status/;
}
location /status/ {
    include snippets/server-status-headers.conf;
    limit_except GET HEAD { deny all; }
    limit_req zone=status burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090;   # keeps the /status prefix; set SERVER_STATUS_BASE_PATH=/status
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
