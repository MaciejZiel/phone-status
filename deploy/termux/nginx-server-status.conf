# Include inside the server { } block that is exposed through the tunnel.
# Optional rate limit: put this line in the http { } block and uncomment limit_req below.
#   limit_req_zone $binary_remote_addr zone=status:1m rate=5r/s;
location = /status { return 301 /status/; }
location /status/ {
    limit_except GET HEAD { deny all; }
    # limit_req zone=status burst=20 nodelay;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090;   # keeps the /status prefix; set SERVER_STATUS_BASE_PATH=/status
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
