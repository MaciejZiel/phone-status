# Security headers for the administrator pages and API. Copy to snippets/server-status-headers-admin.conf.
#
# Same as nginx-headers.conf except the CSP allows the login form to post to its own origin
# (form-action 'self'), and the response is marked uncacheable. Keep it in sync with ADMIN_CSP in
# src/server_status/server.py (a test checks it). The app sends Cache-Control: no-store itself;
# nginx repeats it so its own 429/502 responses are not stored either.
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cache-Control "no-store" always;
