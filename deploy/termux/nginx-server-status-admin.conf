# Administrator view. Include next to nginx-server-status.conf, inside the same server { } block.
# Needs, besides the files named in nginx-server-status.conf:
#   nginx-zones.conf          the statuslogin zone below
#   nginx-headers-admin.conf  copied to snippets/server-status-headers-admin.conf
#
# Never cache these paths and never serve them from a shared cache: they carry the full host data.
# The app has its own login limit (5 attempts per 5 minutes per visitor, then 429); this is the outer one.

# Login form and its POST: 5 requests per minute per visitor (burst 5), the rest get 429.
location = /status/admin/login {
    include snippets/server-status-headers-admin.conf;
    limit_except GET HEAD POST { deny all; }
    limit_req zone=statuslogin burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
# The page, logout and the JSON the page polls every 15 s.
location ^~ /status/admin {
    include snippets/server-status-headers-admin.conf;
    limit_except GET HEAD POST { deny all; }
    limit_req zone=status burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location ^~ /status/api/admin {
    include snippets/server-status-headers-admin.conf;
    limit_except GET HEAD { deny all; }
    limit_req zone=status burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
