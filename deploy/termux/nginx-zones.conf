# Goes in the http {} block (include it from nginx.conf). Defines the rate-limit key for the status page.
#
# Behind a tunnel every request reaches nginx from 127.0.0.1, so a limit keyed on the remote address
# would be one shared bucket for all visitors. Cloudflare Tunnel passes the visitor's address in
# CF-Connecting-IP; use it when present (same approach as the pgqueue and contrail snippets).
# With another tunnel, put the header it sets here, and make sure nginx is reachable only through the
# tunnel, or the header can be forged.
map $http_cf_connecting_ip $status_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# 10 requests per second per visitor. One page load is about 7 requests and the page polls every 15 s.
limit_req_zone $status_client zone=status:1m rate=10r/s;
