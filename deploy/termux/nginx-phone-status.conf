# Include inside the server { } block that is exposed through the tunnel.
location = /status { return 301 /status/; }
location /status/ {
    proxy_pass http://127.0.0.1:8090;   # keeps the /status prefix; set PHONE_STATUS_BASE_PATH=/status
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    limit_except GET HEAD { deny all; }
}
