# Security headers for the status page. Included by the location blocks in nginx-server-status.conf
# (copy this file next to nginx.conf, e.g. $PREFIX/etc/nginx/snippets/server-status-headers.conf).
#
# The app sends the same headers itself; hiding its copies and setting them here as well means nginx's
# own responses (301 redirect, 429 rate limit, 502 when the app is down) carry them too, without duplicates.
# nginx drops inherited add_header lines in a block that sets its own, so keep every add_header here.
# Keep the Content-Security-Policy in sync with CSP in src/server_status/server.py (a test checks it).
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
