[[services]]
id = "plan-bot"
name = "plan-bot"
description = "Planning assistant bot"
health_url = "http://127.0.0.1:8191/planbot/health"

[[services]]
id = "pgqueue"
name = "pgqueue demo"
description = "PostgreSQL job queue demo"
health_url = "http://127.0.0.1:8191/pgqueue/health"
